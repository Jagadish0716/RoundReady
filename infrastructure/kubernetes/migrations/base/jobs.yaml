apiVersion: batch/v1
kind: Job
metadata: &auth-meta
  name: auth-service-migration
  labels: {app.kubernetes.io/name: auth-service, app.kubernetes.io/component: migration, app.kubernetes.io/part-of: roundready, app.kubernetes.io/managed-by: kustomize}
spec: &job-spec
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: auth-service, app.kubernetes.io/component: migration, app.kubernetes.io/part-of: roundready}
    spec:
      restartPolicy: Never
      serviceAccountName: auth-service
      automountServiceAccountToken: true
      securityContext: &pod-security {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: roundready/auth-service:replace-with-immutable-id
          imagePullPolicy: IfNotPresent
          command: [alembic, -c, alembic.ini, upgrade, head]
          envFrom: [{secretRef: {name: auth-service-migration}}]
          resources: &resources {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: &container-security {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: &auth-mount [{name: runtime-secrets, mountPath: /mnt/secrets-store, readOnly: true}]
      volumes: &auth-volume [{name: runtime-secrets, csi: {driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: auth-service-migration}}}]
---
