apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: auth-service-migration, labels: {app.kubernetes.io/name: auth-service, app.kubernetes.io/component: migration-secrets, app.kubernetes.io/part-of: roundready}}
spec:
  provider: aws
  secretObjects: [{secretName: auth-service-migration, type: Opaque, data: [{objectName: AUTH_DATABASE_URL, key: AUTH_DATABASE_URL}]}]
  parameters: &auth-parameters
    usePodIdentity: "true"
    objects: |
      - objectName: "$(SECRET_NAME_PREFIX)-auth-database"
        objectType: secretsmanager
        jmesPath:
          - {path: database_url, objectAlias: AUTH_DATABASE_URL}
---
