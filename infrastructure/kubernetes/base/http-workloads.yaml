apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: &gateway-labels
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: roundready
    app.kubernetes.io/managed-by: kustomize
    roundready.io/workload-kind: http
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: &rolling
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: api-gateway}
  template:
    metadata:
      labels: *gateway-labels
    spec: &gateway-pod
      serviceAccountName: api-gateway
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext: &pod-security
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api-gateway
          image: roundready/api-gateway:replace-with-immutable-id
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000, protocol: TCP}]
          envFrom: [{configMapRef: {name: roundready-runtime-config}}]
          env:
            - {name: AUTH_SERVICE_URL, value: "http://auth-service:8000"}
            - {name: USER_SERVICE_URL, value: "http://user-service:8000"}
            - {name: INTERVIEWER_SERVICE_URL, value: "http://interviewer-service:8000"}
            - {name: BOOKING_SERVICE_URL, value: "http://booking-service:8000"}
            - {name: PAYMENT_SERVICE_URL, value: "http://payment-service:8000"}
            - {name: INTERVIEW_SERVICE_URL, value: "http://interview-service:8000"}
            - {name: NOTIFICATION_SERVICE_URL, value: "http://notification-service:8000"}
          resources: &http-resources
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe: &startup-probe
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe: &readiness-probe
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe: &liveness-probe
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts: &tmp-mount
            - {name: tmp, mountPath: /tmp}
      volumes: &tmp-volume
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
