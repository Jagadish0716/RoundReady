apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-gateway-runtime
  labels: {app.kubernetes.io/name: api-gateway, app.kubernetes.io/component: secrets, app.kubernetes.io/part-of: roundready, app.kubernetes.io/managed-by: kustomize}
spec:
  provider: aws
  secretObjects:
    - secretName: api-gateway-runtime
      type: Opaque
      data:
        - {objectName: JWT_VERIFICATION_KEY, key: JWT_VERIFICATION_KEY}
        - {objectName: INTERNAL_IDENTITY_SECRET, key: INTERNAL_IDENTITY_SECRET}
        - {objectName: NOTIFICATION_INTERNAL_IDENTITY_SECRET, key: NOTIFICATION_INTERNAL_IDENTITY_SECRET}
        - {objectName: REDIS_URL, key: REDIS_URL}
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "$(SECRET_NAME_PREFIX)-jwt-verification"
        objectType: secretsmanager
        jmesPath:
          - {path: jwt_verification_key, objectAlias: JWT_VERIFICATION_KEY}
      - objectName: "$(SECRET_NAME_PREFIX)-internal-identity"
        objectType: secretsmanager
        jmesPath:
          - {path: internal_identity_secret, objectAlias: INTERNAL_IDENTITY_SECRET}
          - {path: notification_internal_identity_secret, objectAlias: NOTIFICATION_INTERNAL_IDENTITY_SECRET}
      - objectName: "$(SECRET_NAME_PREFIX)/redis/credentials"
        objectType: secretsmanager
        jmesPath:
          - {path: redis_url, objectAlias: REDIS_URL}
---
