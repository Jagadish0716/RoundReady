apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-outbox-worker
  labels: &auth-worker-labels
    app.kubernetes.io/name: auth-outbox-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: roundready
    app.kubernetes.io/managed-by: kustomize
    roundready.io/service: auth-service
    roundready.io/workload-kind: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app.kubernetes.io/name: auth-outbox-worker}}
  template:
    metadata: {labels: *auth-worker-labels}
    spec:
      serviceAccountName: auth-service
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      securityContext: &worker-pod-security
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: roundready/auth-service:replace-with-immutable-id
          imagePullPolicy: IfNotPresent
          command: [python, -m, app.workers.outbox]
          envFrom: &runtime-config [{configMapRef: {name: roundready-runtime-config}}]
          resources: &worker-resources
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext: &worker-container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: &worker-tmp-mount [{name: tmp, mountPath: /tmp}]
      volumes: &worker-tmp-volume [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
