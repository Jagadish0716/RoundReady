apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - pod-disruption-budgets.yaml

labels:
  - pairs:
      roundready.io/environment: production
    includeSelectors: false

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: roundready.io/workload-kind=http
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                roundready.io/workload-kind: http
            matchLabelKeys:
              - app.kubernetes.io/name
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                roundready.io/workload-kind: http
            matchLabelKeys:
              - app.kubernetes.io/name
