# Local development only. This file deliberately pins every application to development mode.
name: roundready-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: roundready-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-roundready_auth}
      AUTH_DB_USER: ${AUTH_DB_USER:?Set AUTH_DB_USER in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      USER_DB_NAME: ${USER_DB_NAME:-roundready_user}
      USER_DB_USER: ${USER_DB_USER:?Set USER_DB_USER in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      INTERVIEWER_DB_NAME: ${INTERVIEWER_DB_NAME:-roundready_interviewer}
      INTERVIEWER_DB_USER: ${INTERVIEWER_DB_USER:?Set INTERVIEWER_DB_USER in .env}
      INTERVIEWER_DB_PASSWORD: ${INTERVIEWER_DB_PASSWORD:?Set INTERVIEWER_DB_PASSWORD in .env}
      BOOKING_DB_NAME: ${BOOKING_DB_NAME:-roundready_booking}
      BOOKING_DB_USER: ${BOOKING_DB_USER:?Set BOOKING_DB_USER in .env}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD in .env}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-roundready_payment}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:?Set PAYMENT_DB_USER in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
      INTERVIEW_DB_NAME: ${INTERVIEW_DB_NAME:-roundready_interview}
      INTERVIEW_DB_USER: ${INTERVIEW_DB_USER:?Set INTERVIEW_DB_USER in .env}
      INTERVIEW_DB_PASSWORD: ${INTERVIEW_DB_PASSWORD:?Set INTERVIEW_DB_PASSWORD in .env}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-roundready_notification}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:?Set NOTIFICATION_DB_USER in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - roundready-postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [roundready-local]

  redis:
    image: redis:7-alpine
    container_name: roundready-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - roundready-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [roundready-local]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: roundready-rabbitmq
    hostname: roundready-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-roundready}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - roundready-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [roundready-local]

  auth-service:
    build: {context: .., dockerfile: services/auth-service/Dockerfile}
    container_name: roundready-auth-service
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &auth-environment
      ENVIRONMENT: development
      AUTH_DATABASE_URL: postgresql+asyncpg://${AUTH_DB_USER:?}:${AUTH_DB_PASSWORD:?}@postgres:5432/${AUTH_DB_NAME:-roundready_auth}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      JWT_ISSUER: ${JWT_ISSUER:-roundready-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-roundready-api}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/${RABBITMQ_VHOST:-roundready}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-roundready.events}
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    healthcheck: &api-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [roundready-local]

  user-service:
    build: {context: .., dockerfile: services/user-service/Dockerfile}
    container_name: roundready-user-service
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      ENVIRONMENT: development
      USER_DATABASE_URL: postgresql+asyncpg://${USER_DB_USER:?}:${USER_DB_PASSWORD:?}@postgres:5432/${USER_DB_NAME:-roundready_user}
      INTERNAL_IDENTITY_SECRET: ${INTERNAL_IDENTITY_SECRET:?Set INTERNAL_IDENTITY_SECRET in .env}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: *api-health
    networks: [roundready-local]

  interviewer-service:
    build: {context: .., dockerfile: services/interviewer-service/Dockerfile}
    container_name: roundready-interviewer-service
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &interviewer-environment
      ENVIRONMENT: development
      INTERVIEWER_DATABASE_URL: postgresql+asyncpg://${INTERVIEWER_DB_USER:?}:${INTERVIEWER_DB_PASSWORD:?}@postgres:5432/${INTERVIEWER_DB_NAME:-roundready_interviewer}
      INTERNAL_IDENTITY_SECRET: ${INTERNAL_IDENTITY_SECRET:?}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/${RABBITMQ_VHOST:-roundready}
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: *api-health
    networks: [roundready-local]

  booking-service:
    build: {context: .., dockerfile: services/booking-service/Dockerfile}
    container_name: roundready-booking-service
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &booking-environment
      ENVIRONMENT: development
      BOOKING_DATABASE_URL: postgresql+asyncpg://${BOOKING_DB_USER:?}:${BOOKING_DB_PASSWORD:?}@postgres:5432/${BOOKING_DB_NAME:-roundready_booking}
      BOOKING_REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/2
      INTERNAL_IDENTITY_SECRET: ${INTERNAL_IDENTITY_SECRET:?}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/${RABBITMQ_VHOST:-roundready}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: *api-health
    networks: [roundready-local]

  payment-service:
    build: {context: .., dockerfile: services/payment-service/Dockerfile}
    container_name: roundready-payment-service
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &payment-environment
      ENVIRONMENT: development
      PAYMENT_DATABASE_URL: postgresql+asyncpg://${PAYMENT_DB_USER:?}:${PAYMENT_DB_PASSWORD:?}@postgres:5432/${PAYMENT_DB_NAME:-roundready_payment}
      INTERNAL_IDENTITY_SECRET: ${INTERNAL_IDENTITY_SECRET:?}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/${RABBITMQ_VHOST:-roundready}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?}
      RAZORPAY_TEST_MODE: "true"
      PAYMENT_PROVIDER: development
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: *api-health
    networks: [roundready-local]

  interview-service:
    build: {context: .., dockerfile: services/interview-service/Dockerfile}
    container_name: roundready-interview-service
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &interview-environment
      ENVIRONMENT: development
      INTERVIEW_DATABASE_URL: postgresql+asyncpg://${INTERVIEW_DB_USER:?}:${INTERVIEW_DB_PASSWORD:?}@postgres:5432/${INTERVIEW_DB_NAME:-roundready_interview}
      INTERNAL_IDENTITY_SECRET: ${INTERNAL_IDENTITY_SECRET:?}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/${RABBITMQ_VHOST:-roundready}
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      LIVEKIT_TEST_MODE: "true"
      VIDEO_PROVIDER: development
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: *api-health
    networks: [roundready-local]

  notification-service:
    build: {context: .., dockerfile: services/notification-service/Dockerfile}
    container_name: roundready-notification-service
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &notification-environment
      ENVIRONMENT: development
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://${NOTIFICATION_DB_USER:?}:${NOTIFICATION_DB_PASSWORD:?}@postgres:5432/${NOTIFICATION_DB_NAME:-roundready_notification}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/${RABBITMQ_VHOST:-roundready}
      USER_SERVICE_URL: http://user-service:8000
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?}
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: *api-health
    networks: [roundready-local]

  api-gateway:
    build: {context: .., dockerfile: services/api-gateway/Dockerfile}
    container_name: roundready-api-gateway
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8000
      INTERVIEWER_SERVICE_URL: http://interviewer-service:8000
      BOOKING_SERVICE_URL: http://booking-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      INTERVIEW_SERVICE_URL: http://interview-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      INTERNAL_IDENTITY_SECRET: ${INTERNAL_IDENTITY_SECRET:?}
      NOTIFICATION_INTERNAL_IDENTITY_SECRET: ${INTERNAL_SERVICE_SECRET:?}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports: ["127.0.0.1:${API_GATEWAY_PORT:-8000}:8000"]
    depends_on:
      auth-service: {condition: service_healthy}
      user-service: {condition: service_healthy}
      interviewer-service: {condition: service_healthy}
      booking-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
      interview-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: *api-health
    networks: [roundready-local]

  auth-outbox-worker:
    build: {context: .., dockerfile: services/auth-service/Dockerfile}
    container_name: roundready-auth-outbox-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbox"]
    environment: *auth-environment
    depends_on: {auth-service: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    networks: [roundready-local]

  interviewer-outbox-worker:
    build: {context: .., dockerfile: services/interviewer-service/Dockerfile}
    container_name: roundready-interviewer-outbox-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbox"]
    environment: *interviewer-environment
    depends_on: {interviewer-service: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    networks: [roundready-local]

  booking-worker:
    build: {context: .., dockerfile: services/booking-service/Dockerfile}
    container_name: roundready-booking-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.maintenance"]
    environment: *booking-environment
    depends_on: {booking-service: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    networks: [roundready-local]

  booking-event-worker:
    build: {context: .., dockerfile: services/booking-service/Dockerfile}
    container_name: roundready-booking-event-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.events"]
    environment: *booking-environment
    depends_on: {booking-service: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    networks: [roundready-local]

  payment-outbox-worker:
    build: {context: .., dockerfile: services/payment-service/Dockerfile}
    container_name: roundready-payment-outbox-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbox"]
    environment: *payment-environment
    depends_on: {payment-service: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    networks: [roundready-local]

  interview-event-worker:
    build: {context: .., dockerfile: services/interview-service/Dockerfile}
    container_name: roundready-interview-event-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.events"]
    environment: *interview-environment
    depends_on: {interview-service: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    networks: [roundready-local]

  interview-outbox-worker:
    build: {context: .., dockerfile: services/interview-service/Dockerfile}
    container_name: roundready-interview-outbox-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbox"]
    environment: *interview-environment
    depends_on: {interview-service: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    networks: [roundready-local]

  notification-worker:
    build: {context: .., dockerfile: services/notification-service/Dockerfile}
    container_name: roundready-notification-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.consumer"]
    environment: *notification-environment
    depends_on:
      notification-service: {condition: service_healthy}
      user-service: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [roundready-local]

networks:
  roundready-local:
    name: roundready-local-network
    driver: bridge

volumes:
  roundready-postgres-data:
    name: roundready-postgres-data
  roundready-redis-data:
    name: roundready-redis-data
  roundready-rabbitmq-data:
    name: roundready-rabbitmq-data
