name: roundready-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: roundready-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-roundready_auth}
      AUTH_DB_USER: ${AUTH_DB_USER:?Set AUTH_DB_USER in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      USER_DB_NAME: ${USER_DB_NAME:-roundready_user}
      USER_DB_USER: ${USER_DB_USER:?Set USER_DB_USER in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      INTERVIEWER_DB_NAME: ${INTERVIEWER_DB_NAME:-roundready_interviewer}
      INTERVIEWER_DB_USER: ${INTERVIEWER_DB_USER:?Set INTERVIEWER_DB_USER in .env}
      INTERVIEWER_DB_PASSWORD: ${INTERVIEWER_DB_PASSWORD:?Set INTERVIEWER_DB_PASSWORD in .env}
      BOOKING_DB_NAME: ${BOOKING_DB_NAME:-roundready_booking}
      BOOKING_DB_USER: ${BOOKING_DB_USER:?Set BOOKING_DB_USER in .env}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD in .env}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-roundready_payment}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:?Set PAYMENT_DB_USER in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
      INTERVIEW_DB_NAME: ${INTERVIEW_DB_NAME:-roundready_interview}
      INTERVIEW_DB_USER: ${INTERVIEW_DB_USER:?Set INTERVIEW_DB_USER in .env}
      INTERVIEW_DB_PASSWORD: ${INTERVIEW_DB_PASSWORD:?Set INTERVIEW_DB_PASSWORD in .env}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-roundready_notification}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:?Set NOTIFICATION_DB_USER in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - roundready-postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [roundready-local]

  redis:
    image: redis:7-alpine
    container_name: roundready-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - roundready-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [roundready-local]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: roundready-rabbitmq
    hostname: roundready-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-roundready}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - roundready-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [roundready-local]

networks:
  roundready-local:
    name: roundready-local-network
    driver: bridge

volumes:
  roundready-postgres-data:
    name: roundready-postgres-data
  roundready-redis-data:
    name: roundready-redis-data
  roundready-rabbitmq-data:
    name: roundready-rabbitmq-data
